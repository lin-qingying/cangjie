# 补全各阶段的耗时预算（任务 13.2 的「预算须写入具名测试配置文件后才可评估阶段门禁」）。
#
# 为什么要有这个文件：门禁阈值不能散落在测试代码的常量里——那样「改阈值」与「改测量方式」
# 在 diff 里长得一样，评审看不出动了哪一处。预算集中在这里，谁改了什么一目了然。
#
# 键格式：stage.<profile>.<STAGE>=<毫秒>；profile 取 small/large × cold/warm。
#   small = LSP 集成夹具的单文件工作区；large = 同一工作区 + 200 个生成文件。
#   cold  = 该 profile 上的首次补全（含分析会话冷启动）；warm = 其后的补全（取中位数）。
#
# 两份守卫：
# - `code-insight/completion/impl-shared/test/.../statistics/CompletionStageBudgetConfigTest`：
#   机械校验覆盖率——每个 `CompletionStage` × 每个 profile 都必须有条目（新增阶段而没给预算即红），
#   且同阶段的预算满足 cold ≥ warm、large ≥ small。
# - `lsp/test/.../LspCompletionStageBaselineTest`：用真实管线测四个 profile 的阶段中位数（纳秒换算成毫秒），
#   既按这里的预算做门禁，也把实测值打印成 `CJD-BASELINE …` 供人工比对漂移。
#
# 取值口径：**只挡量级回归**，取实测中位数的 5–10 倍并向下取整到整数百毫秒（未实测到的阶段给同档下限）。
# 目的是让「退化成全工作区扫描」（13.1 明令禁止的那件事）这类事故必然触发，
# 又不让并行构建造成的机器噪声误报。大投影的意义就在这里：候选若开始遍历整仓声明，
# 文件数一多，INDEX_QUERY/CANDIDATES 会立刻顶破预算。
#
# 实测基线（2026-10-10/11，Windows 11 / JDK 17；未列出的阶段当次未触发）：
#   small.cold: SETUP=188ms CANDIDATES=363ms INDEX_QUERY=98ms RENDER=2ms
#   small.warm: SETUP=6ms CANDIDATES=25ms INDEX_QUERY=10ms RENDER=0ms
#   large.cold: SETUP=5ms CANDIDATES=605ms INDEX_QUERY=564ms RENDER=0ms
#   large.warm: SETUP=3ms CANDIDATES=45ms INDEX_QUERY=34ms RENDER=0ms

# profile: small.cold
stage.small.cold.SETUP=2000
stage.small.cold.CONTEXT=2000
stage.small.cold.CANDIDATES=4000
stage.small.cold.INDEX_QUERY=1500
stage.small.cold.RENDER=200
stage.small.cold.INSERT=200
stage.small.cold.RESOLVE=2000

# profile: small.warm
stage.small.warm.SETUP=500
stage.small.warm.CONTEXT=500
stage.small.warm.CANDIDATES=500
stage.small.warm.INDEX_QUERY=500
stage.small.warm.RENDER=200
stage.small.warm.INSERT=200
stage.small.warm.RESOLVE=500

# profile: large.cold
stage.large.cold.SETUP=1000
stage.large.cold.CONTEXT=1000
stage.large.cold.CANDIDATES=6000
stage.large.cold.INDEX_QUERY=6000
stage.large.cold.RENDER=200
stage.large.cold.INSERT=200
stage.large.cold.RESOLVE=1000

# profile: large.warm
stage.large.warm.SETUP=500
stage.large.warm.CONTEXT=500
stage.large.warm.CANDIDATES=1000
stage.large.warm.INDEX_QUERY=1000
stage.large.warm.RENDER=200
stage.large.warm.INSERT=200
stage.large.warm.RESOLVE=500
