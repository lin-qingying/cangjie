org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
systemProp.jdk.xml.maxGeneralEntitySizeLimit=0
kotlin.daemon.jvmargs=-Xmx4g


kotlin.incremental=true
kotlin.incremental.multiplatform=true

# 用进程内编译，省去进程启动开销
kotlin.compiler.execution.strategy=in-process
cangjieVersion=1.1.1

# IntelliJ Platform SDK 版本（对齐 Kotlin K2 的依赖管理方式）
intellijSdkVersion=253.29346.379

# Vendored LLVM release artifacts for llvm-interop JNI build.
llvm.dir=D:/code/intellij/cangjie/llvm-interop/third_party/llvm-release
