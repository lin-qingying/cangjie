pluginVersion=1.0.0-SNAPSHOT

# DevEco 插件兼容区间。253 对应 IntelliJ Platform 2025.3 基线。
pluginSinceBuild=253

# 无本地 DevEco 安装时，使用该平台基线完成 Gradle 同步与源码分析。
# 2025.3 起 IntelliJ IDEA 不再区分 IC/IU 发布坐标，需使用 intellijIdea(version)。
devecoSyncPlatformVersion=2025.3.1

# 主仓库 for-ide 运行时产物版本。复合构建会优先替换为源码项目。
cangjieIdeVersion=1.1.1

# 可选：配置后可直接使用本地 DevEco 安装进行 runIde / buildPlugin。
# devEcoHome=C:/Program Files/Huawei/DevEco Studio

# 可选：只有确认真实插件 ID 后才填写，避免把未经验证的内置插件标识写死。
# devecoBundledCangjiePluginId=com.huawei.deveco.language.cangjie

gradleVersion=9.2.1
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
