# OpenTelemetry Collector 配置：Analysis API 统计的采集与看板
#
# 指标本身是 OpenTelemetry 标准的 LongCounter / LongHistogram，采集、聚合、落盘、看板都是
# 现成组件的事，仓里不自己写渲染逻辑。
#
# 启动：docker compose up -d（见同目录 docker-compose.yml）
# 前端：http://localhost:16686
# 直连 OTLP gRPC：localhost:4317

receivers:
  # 与 CaPerformanceTestTelemetry 的 OtlpGrpcMetricExporter 对应：它发 gRPC，所以这里
  # 必须开 grpc 端口。http 同时开是为了让 curl 之类的临时排查能用。
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # 先于 batch 执行：批处理的排队窗口会让瞬时内存涨过限，硬丢数据反而更糟。
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # 攒 5 秒再发。指标按 JVM 累积（cumulative temporality），所以间隔越短看板上的
  # cumulative 值抖动越大；5 秒是对"想看趋势"和"别把 exporter 打爆"的折中。
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # 转给 Jaeger，由它存与渲染。CangJie 的指标全在 cangjie.* 命名空间下。
  # 用 otlp_grpc 而非 otlp：后者在 contrib 0.161 已是弃用别名，会打 deprecation warning。
  #
  # 端点是 4317：all-in-one 镜像 EXPOSE 声明的 OTLP gRPC 端口就是 4317（另有 4318 HTTP）。
  #
  # 此前试过 1417 并提交，那是我推断错了：镜像 EXPOSE 里没有 1417，collector 连它直接
  # connection refused。1417 是 Jaeger 1.x 某些自建部署的端口，all-in-one 不用它。
  #
  # 未解决：走 4317 gRPC 时 collector 收到
  #   code = Unimplemented desc = unknown service
  #       opentelemetry.proto.collector.metrics.v1.MetricsService
  # 即连得上、但 Jaeger 没注册这个服务名。下一步是探 4318 的 OTLP HTTP 服务是否可用，可用就
  # 把这里换成 otlp_http/jaeger 指向 4318。先记在配置里，别让它只活在对话里。
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # 落 JSON 行，离线或 CI 归档时用，不依赖 Jaeger 还在跑。
  #
  # 路径必须在 /tmp 下：contrib 镜像是 distroless（无 shell、非 root），它自己建不出
  # /var/lib/otel 这样的目录，启动会直接失败：
  #   failed to start "file" exporter: open /var/lib/otel/metrics.json: no such file or directory
  # compose 里把宿主机目录挂到 /tmp/otel，落盘文件才拿得回来。
  file:
    path: /tmp/otel/metrics.json

  # 基本日志：collector 自己看到什么、收到了哪些指标，出问题时先看这里。
  #
  # 用 debug 而非 logging：contrib 新版已把 logging exporter 标记弃用，配了它 collector
  # 直接拒绝启动（'exporters' the logging exporter has been deprecated, use the debug
  # exporter instead），且 verbosity 的取值也从 basic/normal 改成了 normal/detailed。
  debug:
    verbosity: normal

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/jaeger, file, debug]
  telemetry:
    logs:
      level: info