# Analysis API 性能统计的本地采集栈。
#
# 启动：
#   docker compose -f tools/otel/docker-compose.yml up -d
#
# 跑测试并把指标推过去：
#   ./gradlew :analysis:analysis-performance-test:test \
#       -Dcangjie.performance.otlp.endpoint=http://localhost:4317
#
# 看板上指标全在 cangjie.* 命名空间下。累计型（cumulative）指标不会自己变小，
# 两次运行对比请先取差值或在 Jaeger 里用 rate。

services:
  # Jaeger all-in-one：自带存储与 UI，不需要另接后端。
  jaeger:
    # 钉在 1.62.0 而不是 latest：latest 的 OTLP receiver 只到 StatusStarting 从未 ready，
    # collector 推过去得到 Unimplemented（unknown service MetricsService），Jaeger UI 恒空。
    # 1.62.0 的 OTLP gRPC/HTTP 两个 server 都正常启动。用 latest 时 UI 正常但指标进不去，
    # 症状极具误导性——看起来像"指标没发出去"，实际是收端没就绪。
    image: jaegertracing/all-in-one:1.62.0
    environment:
      # all-in-one 默认不接 OTLP，要显式打开才能当 collector 的下游。
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # 只暴露 UI。4317 绝不能映射到宿主机：collector 的 OTLP 接收端口也是 4317，
      # 两者冲突会让 collector 起不来（Bind for 0.0.0.0:4317 failed: port is already allocated）。
      # Jaeger 作为下游只需在 compose 网络内可达，由 collector 通过 otlp/jaeger 连。
      - "16686:16686"

  collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      # 落盘目录。file exporter 只能写 /tmp（distroless 建不出 /var/lib/otel），
      # 所以挂在 /tmp/otel 上，落盘文件才能从宿主机取回。
      - ./otel-data:/tmp/otel
    ports:
      - "4317:4317" # 测试进程的 OtlpGrpcMetricExporter 打到这里
      - "4318:4318" # OTLP HTTP，供临时排查
      - "8889:8889" # collector 自身指标
    depends_on:
      - jaeger