# Quick Doc Sections
quick.doc.no.documentation=No documentation available
quick.doc.text.enum.ordinal=Enum constructor ordinal: {0}
quick.doc.section.deprecated=Deprecated:
quick.doc.basic.type.bool=Represents logical truth. Its only values are true and false. Example: let enabled: Bool = true.
quick.doc.basic.type.rune=Represents a Unicode character. Rune literals use the r prefix. Example: let letter: Rune = r'A'.
quick.doc.basic.type.int8=Signed 8-bit integer with a range from -128 to 127. Example: let value: Int8 = 42.
quick.doc.basic.type.int16=Signed 16-bit integer with a range from -32,768 to 32,767. Example: let value: Int16 = 42.
quick.doc.basic.type.int32=Signed 32-bit integer with a range from -2,147,483,648 to 2,147,483,647. Example: let value: Int32 = 42.
quick.doc.basic.type.int64=Signed 64-bit integer with a range from -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807. Example: let value: Int64 = 42.
quick.doc.basic.type.int.native=Signed integer whose width and value range depend on the target platform. Example: let value: IntNative = 42.
quick.doc.basic.type.uint8=Unsigned 8-bit integer with a range from 0 to 255. Example: let value: UInt8 = 42.
quick.doc.basic.type.uint16=Unsigned 16-bit integer with a range from 0 to 65,535. Example: let value: UInt16 = 42.
quick.doc.basic.type.uint32=Unsigned 32-bit integer with a range from 0 to 4,294,967,295. Example: let value: UInt32 = 42.
quick.doc.basic.type.uint64=Unsigned 64-bit integer with a range from 0 to 18,446,744,073,709,551,615. Example: let value: UInt64 = 42.
quick.doc.basic.type.uint.native=Unsigned integer whose width and value range depend on the target platform. Example: let value: UIntNative = 42.
quick.doc.basic.type.float16=16-bit floating-point type using the IEEE 754 binary16 format, with about 3 decimal digits of precision. Example: let value: Float16 = 1.5f16.
quick.doc.basic.type.float32=32-bit floating-point type using the IEEE 754 binary32 format, with about 6 decimal digits of precision. Example: let value: Float32 = 1.5f32.
quick.doc.basic.type.float64=64-bit floating-point type using the IEEE 754 binary64 format, with about 15 decimal digits of precision. Example: let value: Float64 = 1.5.
quick.doc.basic.type.unit=The type of expressions whose result is not used. Unit has one value, written as (). Example: func update(): Unit {}.
quick.doc.basic.type.nothing=The bottom type with no values; it is a subtype of every type. Expressions such as return, throw, break, and continue have type Nothing. The compiler currently does not allow Nothing to be written explicitly in a type position.
