# Quick Doc 基本类型（每个类型独立维护文档）
quick.doc.basic.type.bool=表示逻辑真值，仅有 true 和 false 两个值。示例：let enabled: Bool = true。
quick.doc.basic.type.rune=表示 Unicode 字符。Rune 字面量以 r 开头。示例：let letter: Rune = r'A'。
quick.doc.basic.type.int8=8 位有符号整数，取值范围为 -128 到 127。示例：let value: Int8 = 42。
quick.doc.basic.type.int16=16 位有符号整数，取值范围为 -32,768 到 32,767。示例：let value: Int16 = 42。
quick.doc.basic.type.int32=32 位有符号整数，取值范围为 -2,147,483,648 到 2,147,483,647。示例：let value: Int32 = 42。
quick.doc.basic.type.int64=64 位有符号整数，取值范围为 -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807。示例：let value: Int64 = 42。
quick.doc.basic.type.int.native=有符号整数，位宽和取值范围取决于目标平台。示例：let value: IntNative = 42。
quick.doc.basic.type.uint8=8 位无符号整数，取值范围为 0 到 255。示例：let value: UInt8 = 42。
quick.doc.basic.type.uint16=16 位无符号整数，取值范围为 0 到 65,535。示例：let value: UInt16 = 42。
quick.doc.basic.type.uint32=32 位无符号整数，取值范围为 0 到 4,294,967,295。示例：let value: UInt32 = 42。
quick.doc.basic.type.uint64=64 位无符号整数，取值范围为 0 到 18,446,744,073,709,551,615。示例：let value: UInt64 = 42。
quick.doc.basic.type.uint.native=无符号整数，位宽和取值范围取决于目标平台。示例：let value: UIntNative = 42。
quick.doc.basic.type.float16=16 位浮点类型，采用 IEEE 754 binary16 格式，精度约为 3 位十进制有效数字。示例：let value: Float16 = 1.5f16。
quick.doc.basic.type.float32=32 位浮点类型，采用 IEEE 754 binary32 格式，精度约为 6 位十进制有效数字。示例：let value: Float32 = 1.5f32。
quick.doc.basic.type.float64=64 位浮点类型，采用 IEEE 754 binary64 格式，精度约为 15 位十进制有效数字。示例：let value: Float64 = 1.5。
quick.doc.basic.type.unit=表示不需要返回结果的表达式类型。Unit 只有一个值，写作 ()。示例：func update(): Unit {}。
quick.doc.basic.type.nothing=不包含任何值的底类型，是所有类型的子类型。return、throw、break 和 continue 等表达式的类型为 Nothing。当前编译器不允许在类型位置显式写出 Nothing。

