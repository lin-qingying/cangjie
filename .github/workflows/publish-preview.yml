name: publish-preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "intellij-ide/**"
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew test --continue --no-daemon --stacktrace
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    uses: ./.github/workflows/publish-github-packages.yml
    with:
      version: 1.1.2-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}
    permissions:
      contents: read
      packages: write
