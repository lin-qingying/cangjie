name: Build cangjie-llvm-interop

on:
  push:
    paths:
      - "tools/cangjie-llvm-interop/**"
      - ".github/workflows/build-cangjie-llvm-interop.yml"
  pull_request:
    paths:
      - "tools/cangjie-llvm-interop/**"
      - ".github/workflows/build-cangjie-llvm-interop.yml"
  workflow_dispatch:

jobs:
  build-unix:
    name: ${{ matrix.os }} (${{ matrix.host_arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host_arch: x64
          - os: ubuntu-24.04-arm
            host_arch: arm64
          - os: macos-13
            host_arch: x64
          - os: macos-14
            host_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ llvm-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm@18

      - name: Resolve LLVM_DIR
        id: llvm-dir
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            echo "value=$(llvm-config --cmakedir)" >> "$GITHUB_OUTPUT"
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            LLVM_PREFIX="$(brew --prefix llvm@18)"
            echo "value=${LLVM_PREFIX}/lib/cmake/llvm" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported OS: ${RUNNER_OS}" >&2
            exit 1
          fi

      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: tools/cangjie-llvm-interop/build
          key: interop-build-${{ runner.os }}-${{ matrix.host_arch }}-${{ hashFiles('tools/cangjie-llvm-interop/CMakeLists.txt', 'tools/cangjie-llvm-interop/src/**', '.github/workflows/build-cangjie-llvm-interop.yml') }}

      - name: Configure
        run: |
          cmake -S tools/cangjie-llvm-interop -B tools/cangjie-llvm-interop/build -G Ninja \
            -DCANGJIE_USE_OFFICIAL_LLVM=OFF \
            -DLLVM_DIR="${{ steps.llvm-dir.outputs.value }}"

      - name: Build
        run: |
          cmake --build tools/cangjie-llvm-interop/build --parallel

      - name: Probe
        run: |
          tools/cangjie-llvm-interop/build/cangjie-llvm-interop probe --json

  build-windows:
    name: windows-latest (x64)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (cl.exe)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        shell: pwsh
        run: |
          choco install -y ninja llvm

      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: tools/cangjie-llvm-interop/build
          key: interop-build-${{ runner.os }}-x64-${{ hashFiles('tools/cangjie-llvm-interop/CMakeLists.txt', 'tools/cangjie-llvm-interop/src/**', '.github/workflows/build-cangjie-llvm-interop.yml') }}

      - name: Configure
        shell: pwsh
        run: |
          cmake -S tools/cangjie-llvm-interop -B tools/cangjie-llvm-interop/build -G Ninja `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCANGJIE_USE_OFFICIAL_LLVM=OFF `
            -DLLVM_DIR="C:/Program Files/LLVM/lib/cmake/llvm"

      - name: Build
        shell: pwsh
        run: |
          cmake --build tools/cangjie-llvm-interop/build --parallel

      - name: Probe
        shell: pwsh
        run: |
          .\tools\cangjie-llvm-interop\build\cangjie-llvm-interop.exe probe --json
