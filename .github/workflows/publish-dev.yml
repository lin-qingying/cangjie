name: publish-dev
on:
  push:
    branches: [main]
    paths-ignore:
      - "intellij-ide/**"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-dev-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew test --continue --no-daemon --stacktrace
  publish:
    needs: test
    uses: ./.github/workflows/publish-github-packages.yml
    with:
      version: 1.1.2-dev.${{ github.run_number }}.g${{ github.sha }}
    permissions:
      contents: read
      packages: write
