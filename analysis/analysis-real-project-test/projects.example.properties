# 真实项目列表；文件名固定为 projects.properties 时才自动加载，
# 也可以显式传 -PrealProjectConfig=<path>。
#
# 键格式：<id>.repo / <id>.ref / <id>.sdk（可选）/ <id>.refresh（可选）
# 未设置 <id>.sdk 时，使用 -PcangjieHome 或 CANGJIE_HOME。
# <id> 会出现在报告目录与 -PrealProjectFilter 中。
#
# 示例：
# icu4cj.repo=https://example.com/icu4cj.git
# icu4cj.ref=9301a915ccbd7281ebe2ef179c34c58f791fbdba
#
# demo.repo=https://example.com/demo.git
# demo.ref=main
# demo.refresh=false
